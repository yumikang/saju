name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: 141.164.60.51
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/saju
            git pull origin main
            npm ci
            npm run build
            npx prisma migrate deploy
            npx prisma generate
            pm2 restart saju-app || pm2 start npm --name saju-app -- start
            echo "✅ Deployment completed!"
